<svg class="fig" viewBox="0 0 720 452" role="img" aria-labelledby="ido-title" xmlns="http://www.w3.org/2000/svg">
  <title id="ido-title">RAMI 4.0 layers by hierarchy level, with each cell labelled by the executive line that owns it. Operations (COO) owns the field and control levels, the physical station equipment, and the functional and business work at the station and work-centre levels. IT (CIO) owns SCADA, the historian, networks and data platforms from the station level up. Finance (CFO) owns the enterprise business and functional layers.</title>
