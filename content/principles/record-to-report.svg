<svg class="fig" viewBox="0 0 720 420" role="img" aria-labelledby="r2r-title" xmlns="http://www.w3.org/2000/svg">
  <title id="r2r-title">Plans flow down as static artifacts: investor guidance, an annual budget, contracted capacity and an operating plan, which is executed on the pipeline system. Records climb back up from the asset: real-time data in SCADA and the historian, then a daily report, a monthly settlement, quarterly results and an annual report. Each step up adds delay, so a plan that no longer matches the asset can go unnoticed for up to a year.</title>
  <defs><marker id="r2r-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrowhead"/></marker><marker id="r2r-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrowhead-accent"/></marker></defs>
  <text class="f-small f-label" x="12" y="74">Investors</text>
  <line class="f-tie" x1="12" y1="105" x2="640" y2="105"/>
  <text class="f-small f-label" x="12" y="144">Finance</text>
  <line class="f-tie" x1="12" y1="175" x2="640" y2="175"/>
  <text class="f-small f-label" x="12" y="214">Commercial</text>
  <line class="f-tie" x1="12" y1="245" x2="640" y2="245"/>
  <text class="f-small f-label" x="12" y="284">Operations</text>
  <line class="f-tie" x1="12" y1="315" x2="640" y2="315"/>
  <text class="f-small f-label" x="12" y="364">Asset</text>
  <text class="f-small f-muted" x="12" y="88">outside</text>
  <text class="f-heading" x="215" y="26" text-anchor="middle">Plans · made once, flow down</text>
  <text class="f-heading" x="545" y="26" text-anchor="middle">Records · climb back up</text>
  <path class="f-artifact" d="M140 56H278L290 68V84H140Z"/>
  <path class="f-artifact-fold" d="M278 56V68H290"/>
  <text class="f-small" x="215.0" y="74" text-anchor="middle">Investor guidance</text>
  <path class="f-artifact" d="M140 126H278L290 138V154H140Z"/>
  <path class="f-artifact-fold" d="M278 126V138H290"/>
  <text class="f-small" x="215.0" y="144" text-anchor="middle">Annual budget</text>
  <path class="f-artifact" d="M140 196H278L290 208V224H140Z"/>
  <path class="f-artifact-fold" d="M278 196V208H290"/>
  <text class="f-small" x="215.0" y="214" text-anchor="middle">Contracted capacity</text>
  <path class="f-artifact" d="M140 266H278L290 278V294H140Z"/>
  <path class="f-artifact-fold" d="M278 266V278H290"/>
  <text class="f-small" x="215.0" y="284" text-anchor="middle">Operating plan</text>
  <line class="f-flow" x1="215" y1="84" x2="215" y2="124" marker-end="url(#r2r-arrow)"/>
  <line class="f-flow" x1="215" y1="154" x2="215" y2="194" marker-end="url(#r2r-arrow)"/>
  <line class="f-flow" x1="215" y1="224" x2="215" y2="264" marker-end="url(#r2r-arrow)"/>
  <rect class="f-asset" x="280" y="342" width="160" height="36"/>
  <text class="f-label" x="360" y="365" text-anchor="middle">Pipeline system</text>
  <path class="f-flow" d="M215 294V360H278" marker-end="url(#r2r-arrow)"/>
  <text class="f-small f-muted" x="222" y="330">executed on</text>
  <rect class="f-system" x="470" y="347" width="150" height="26" rx="6"/>
  <text class="f-small" x="545" y="364" text-anchor="middle">SCADA · historian</text>
  <line class="f-flow" x1="440" y1="360" x2="468" y2="360" marker-end="url(#r2r-arrow)"/>
  <path class="f-artifact" d="M470 266H608L620 278V294H470Z"/>
  <path class="f-artifact-fold" d="M608 266V278H620"/>
  <text class="f-small" x="545.0" y="284" text-anchor="middle">Daily report</text>
  <path class="f-artifact" d="M470 196H608L620 208V224H470Z"/>
  <path class="f-artifact-fold" d="M608 196V208H620"/>
  <text class="f-small" x="545.0" y="214" text-anchor="middle">Monthly settlement</text>
  <path class="f-artifact" d="M470 126H608L620 138V154H470Z"/>
  <path class="f-artifact-fold" d="M608 126V138H620"/>
  <text class="f-small" x="545.0" y="144" text-anchor="middle">Quarterly results</text>
  <path class="f-artifact" d="M470 56H608L620 68V84H470Z"/>
  <path class="f-artifact-fold" d="M608 56V68H620"/>
  <text class="f-small" x="545.0" y="74" text-anchor="middle">Annual report</text>
  <line class="f-flow" x1="545" y1="347" x2="545" y2="296" marker-end="url(#r2r-arrow)"/>
  <text class="f-small f-muted" x="551" y="316.5">daily</text>
  <line class="f-flow" x1="545" y1="266" x2="545" y2="226" marker-end="url(#r2r-arrow)"/>
  <text class="f-small f-muted" x="551" y="241.0">monthly</text>
  <line class="f-flow" x1="545" y1="196" x2="545" y2="156" marker-end="url(#r2r-arrow)"/>
  <text class="f-small f-muted" x="551" y="171.0">quarterly</text>
  <line class="f-flow" x1="545" y1="126" x2="545" y2="86" marker-end="url(#r2r-arrow)"/>
  <text class="f-small f-muted" x="551" y="101.0">yearly</text>
  <path class="f-accent-flow" d="M660 372V62" marker-end="url(#r2r-arrow-accent)" fill="none"/>
  <text class="f-accent-text" x="676" y="217" text-anchor="middle" transform="rotate(-90 676 217)">Record to report: real time to a year</text>
</svg>
