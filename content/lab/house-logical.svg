  <title id="house-logical-title">The same house by ISA-95 level, in columns by where each piece runs. Zigbee sensors reach Home Assistant through the coordinator on the Raspberry Pi 5, and a WiFi sensor reaches it directly; readings climb to InfluxDB and Grafana on the NAS, with an ESC page planned on top. At the physical level, the furnace and the garage heater are not observed yet; the fridge is watched by a leak sensor; the water heater, stove, washer and dryer are deliberately left unconnected, their loads estimated. Utility bills are planned at the business level.</title>
