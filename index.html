<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efficient Systems Canada</title>
<style>
  :root {
    --bg: #f5f6f4; --ink: #1a1f1c; --muted: #5f6862; --rule: #c8cdc9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161917; --ink: #e4e8e5; --muted: #98a19b; --rule: #343a36; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: grid; place-items: center; padding: 24px;
  }
  main { width: 100%; max-width: 36rem; border-top: 2px solid var(--ink); padding-top: 14px; }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  dl {
    display: grid; grid-template-columns: max-content 1fr; gap: 4px 20px;
    margin: 22px 0 0; padding-top: 12px; border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 0.8125rem;
  }
  dt { color: var(--muted); }
  dd { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Efficient Systems Canada</h1>
  <p>IT/OT convergence and industrial data consulting for the energy sector.</p>
  <dl>
    <dt>Location</dt><dd>Calgary, Alberta</dd>
    <dt>Status</dt><dd>Site in progress</dd>
  </dl>
</main>
</body>
</html>
