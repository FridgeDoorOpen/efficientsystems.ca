<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Classroom tools</title>
<style>
  :root {
    --ink: #000; --text: #22303a; --muted: #5d6b75; --desk: #e6ecef;
    --panel: #fff; --line: #c9d3d9; --focus: #2f6fdb;
    --gothic: "Century Gothic", "CenturyGothic", "URW Gothic", "URW Gothic L", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--gothic); }
  main { max-width: 40rem; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 1.75rem; color: var(--ink); margin: 0 0 6px; }
  .intro { color: var(--muted); margin: 0 0 28px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a {
    display: block; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; color: inherit; text-decoration: none;
  }
  a:hover { border-color: var(--focus); }
  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .name { display: block; font-size: 1.125rem; font-weight: bold; color: var(--ink); margin-bottom: 4px; }
  .desc { color: var(--muted); font-size: 0.9375rem; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <h1>Classroom tools</h1>
  <p class="intro">Printable resources for beginning readers.</p>
  <ul>
    <li>
      <a href="roll-and-read/">
        <span class="name">Roll and Read builder</span>
        <span class="desc">Make irregular word roll-and-read sheets from a UFLI lesson range, then print.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
